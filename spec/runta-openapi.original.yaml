    SuspendOnlyIdlePolicy:
      description: Automatically suspend an idle runtime, but require an explicit Start to wake it.
      type: object
      properties:
        mode:
          type: string
          enum:
            - suspend_only
        suspend_after_secs:
          description: Idle duration before automatic suspension.
          type: integer
          format: uint32
          maximum: 2147483647
          minimum: 1
      required:
        - mode
        - suspend_after_secs
      additionalProperties: false
    SuspendAndWakeupIdlePolicy:
      description: Automatically suspend an idle runtime and wake it on supported activity.
      type: object
      properties:
        mode:
          type: string
          enum:
            - suspend_and_wakeup
        suspend_after_secs:
          description: Idle duration before automatic suspension.
          type: integer
          format: uint32
          maximum: 2147483647
          minimum: 1
      required:
        - mode
        - suspend_after_secs
      additionalProperties: false
    IdlePolicy:
      description: Runtime idle suspension and automatic wakeup policy.
      oneOf:
        - $ref: '#/components/schemas/DisabledIdlePolicy'
        - $ref: '#/components/schemas/SuspendOnlyIdlePolicy'
        - $ref: '#/components/schemas/SuspendAndWakeupIdlePolicy'
    CreateLlmTokenSavingPolicy:
