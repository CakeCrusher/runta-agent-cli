components:
  parameters:
    RuntimeExpectedRevision:
      in: query
      name: expected_revision
      description: Runtime aggregate revision required for optimistic concurrency.
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: Caller-generated key for retry-safe financial mutations.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RuntimeCreateIdempotencyKey:
      in: header
      name: Idempotency-Key
      description: Optional caller-generated key reused across retries of one logical runtime creation.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, malformed, or rejected bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The bearer token is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Validation:
      description: Validation or application error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: Operation is not implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Upstream service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Timeout:
      description: Upstream request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Runta API Key
      description: A Runta API Key bound to exactly one organization.
  schemas:
    CreateCloudAgentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        system_prompt:
          type: string
          maxLength: 65536
        initial_message:
          type: string
          maxLength: 65536
        repositories:
          description: Ordered GitHub repositories to initialize for fresh or checkpoint runtimes. The first is the default workspace. Nonempty selections are not allowed for existing runtimes.
          type: array
          items:
            $ref: '#/components/schemas/RuntimeRepositorySelection'
        model_provider:
          $ref: '#/components/schemas/ManagedModelProviderReference'
        runtime:
          $ref: '#/components/schemas/CloudAgentRuntimeReference'
        harness:
          $ref: '#/components/schemas/CloudAgentHarnessRequest'
      required:
        - model_provider
      additionalProperties: false
    ManagedModelProviderReference:
      type: object
      properties:
        type:
          type: string
          enum:
            - managed
        id:
          type: string
          minLength: 1
      required:
        - type
        - id
      additionalProperties: false
    CloudAgentRuntimeReference:
      type: object
      properties:
        type:
          type: string
          enum:
            - fresh
            - checkpoint
            - existing
        image_id:
          type: string
        checkpoint_id:
          type: string
        id:
          type: string
      required:
        - type
      additionalProperties: false
    CloudAgentHarnessRequest:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
      additionalProperties: false
    CloudAgent:
      type: object
      properties:
        id:
          type: string
        runtime_id:
          type: string
        harness_id:
          type: string
        name:
          type: string
        status:
          type: string
        created_at_unix_seconds:
          type: integer
          format: int64
        updated_at_unix_seconds:
          type: integer
          format: int64
        latest_reply:
          $ref: '#/components/schemas/CloudAgentLatestReply'
      required:
        - id
        - runtime_id
        - harness_id
        - name
        - status
        - created_at_unix_seconds
        - updated_at_unix_seconds
      additionalProperties: false
    CloudAgentLatestReply:
      type: object
      properties:
        run_id:
          type: string
        text:
          type: string
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
      required:
        - run_id
        - text
        - created_at
        - updated_at
      additionalProperties: false
    CloudAgentComputerSession:
      type: object
      properties:
        agent_id:
          type: string
        runtime_id:
          type: string
        expires_at:
          type: string
          format: date-time
        channels:
          $ref: '#/components/schemas/CloudAgentComputerSessionChannels'
      required: [agent_id, runtime_id, expires_at, channels]
      additionalProperties: false
    CloudAgentComputerSessionChannels:
      type: object
      description: Extensible set of transports authorized by this Runta session. VNC is available now; computer-use transports can be added without changing the session envelope.
      properties:
        vnc:
          $ref: '#/components/schemas/CloudAgentVncSessionChannel'
      required: [vnc]
      additionalProperties: false
    CloudAgentVncSessionChannel:
      type: object
      properties:
        websocket_url:
          type: string
          format: uri
        protocols:
          type: array
          items:
            type: string
      required: [websocket_url, protocols]
      additionalProperties: false
    CloudAgentList:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/CloudAgent'
        next_cursor:
          type: string
          nullable: true
      required:
        - agents
        - next_cursor
      additionalProperties: false
    UpdateCloudAgentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - name
      additionalProperties: false
    CreateCloudAgentRunRequest:
      type: object
      properties:
        prompt:
          type: string
          maxLength: 65536
        images:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/CloudAgentPromptImage'
        resume_session_id:
          type: string
        parent_run_id:
          type: string
      required:
        - prompt
      additionalProperties: false
    CloudAgentPromptImage:
      type: object
      properties:
        type:
          type: string
          enum: [image]
        data:
          type: string
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
      required: [type, data, mime_type]
      additionalProperties: false
    CloudAgentRun:
      type: object
      properties:
        id:
          type: string
        agent_id:
          type: string
        status:
          type: string
        prompt:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        parent_run_id:
          type: string
          nullable: true
        dsh_session_id:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
      required:
        - id
        - agent_id
        - status
        - prompt
        - result
        - error
        - parent_run_id
        - dsh_session_id
        - created_at
        - updated_at
      additionalProperties: false
    CloudAgentSessionEvents:
      type: object
      properties:
        agent_id:
          type: string
        session_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/CloudAgentEvent'
      required:
        - agent_id
        - session_id
        - events
      additionalProperties: false
    CloudAgentEvent:
      description: Dynamic ACP event payload.
      type: object
      additionalProperties: true
    CreateCloudAgentArtifactRequest:
      type: object
      properties:
        run_id:
          type: string
        name:
          type: string
        media_type:
          type: string
        content_base64:
          type: string
      required:
        - run_id
        - name
        - content_base64
      additionalProperties: false
    CloudAgentArtifact:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        harness_id:
          type: string
        name:
          type: string
        media_type:
          type: string
        size:
          type: integer
          format: uint64
        created_at:
          type: string
        content_base64:
          type: string
      required:
        - id
        - run_id
        - harness_id
        - name
        - media_type
        - size
        - created_at
      additionalProperties: false
    RuntimeWorkspaceOperationKind:
      type: string
      enum:
        - list_directory
        - read_text
        - search_files
        - read_media
        - list_ports
    RuntimeWorkspaceOperationRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/RuntimeWorkspaceOperationKind'
        path:
          type: string
        query:
          type: string
        offset:
          type: integer
          format: uint64
          minimum: 0
      required:
        - kind
      additionalProperties: false
    RuntimeWorkspaceFileKind:
      type: string
      enum:
        - directory
        - text
