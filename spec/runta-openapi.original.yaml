  /v2/runtimes:
    get:
      tags:
        - Runtimes
      summary: List runtimes
      operationId: listRuntimes
      parameters:
        - in: query
          name: status
          description: Comma-separated public status aliases.
          schema:
            description: Comma-separated public status aliases.
            type: string
          style: form
        - in: query
          name: limit
          description: Maximum number of runtimes to return.
          schema:
            description: Maximum number of runtimes to return.
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 50
          style: form
        - in: query
          name: after
          description: Opaque cursor returned by the previous page.
          schema:
            description: Opaque cursor returned by the previous page.
            type: string
          style: form
      responses:
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: List response envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRuntimesResponse'
