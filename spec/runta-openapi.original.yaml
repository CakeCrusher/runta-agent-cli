openapi: 3.0.3
info:
  title: Runta Public REST API
  description: Public REST API for external developers and the runta CLI.
  version: 0.1.0
servers:
  - url: https://api.runta.com
    description: Hosted public API
paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness check
      operationId: healthz
      responses:
        '200':
          description: no content
    head:
      tags:
        - Health
      summary: Liveness check
      operationId: headHealthz
      responses:
        '200':
          description: no content
  /v2/ssh-host-key:
    get:
      tags:
        - SSH Keys
      summary: Get the stable SSH gateway host key
      operationId: getSshHostKey
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Response envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshHostKeyResponse'
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /v2/auth/token:
    delete:
      tags:
        - Auth
      summary: Revoke the current bearer credential
      operationId: revokeCurrentToken
      responses:
        '204':
          description: Token revoked.
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security:
        - BearerAuth: []
  /v2/auth/device/authorization:
    post:
      tags:
        - Auth
      summary: Start a device authorization
      operationId: beginDeviceAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginDeviceAuthorizationRequest'
      responses:
        '200':
          description: Response envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationStartResponse'
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security: []
  /v2/auth/device/token:
    post:
      tags:
        - Auth
      summary: Exchange a device code for an access token
      operationId: exchangeDeviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeDeviceTokenRequest'
      responses:
        '200':
          description: Device access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          description: OAuth device authorization is pending or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenError'
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security: []
  /v2/me:
    get:
      tags: [Identity]
      summary: Get the current user profile
      operationId: getMe
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        default: {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
      security:
        - BearerAuth: []
