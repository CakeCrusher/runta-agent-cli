    VncGatewayConnection:
      description: Fixed native VNC gateway connection parameters for runtimes in this zone.
      type: object
      properties:
        hostname:
          description: Public VNC gateway DNS hostname.
          type: string
          minLength: 1
        port:
          description: Public native VNC TCP port.
          type: integer
          format: uint16
          minimum: 1
          maximum: 65535
        username:
          description: Username required by the X509Plain handshake.
          type: string
          enum: [runta]
        security_type:
          description: VeNCrypt authentication subtype required by the gateway.
          type: string
          enum: [X509Plain]
      required:
        - hostname
        - port
        - username
        - security_type
      additionalProperties: false
    Runtime:
      description: Runtime response object.
      type: object
      properties:
        environment_variables:
          description: Non-secret environment variables the runtime carries.
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
        display_name:
          description: User-chosen display name.
          type: string
        egress_policy:
          description: Egress policy.
          allOf:
            - $ref: '#/components/schemas/PublicEgressPolicy'
        llm_tool_io_capture_enabled:
          description: Whether official LLM HTTP API tool input/output capture is enabled.
          type: boolean
        llm_session_content_capture_enabled:
          description: Explicitly opt in to user, assistant, and tool conversation content capture. Disabled by default; independent from tool-only capture.
          type: boolean
        llm_token_saving_policy:
          description: Canonical LLM tool-output compression policy.
          allOf:
            - $ref: '#/components/schemas/LlmTokenSavingPolicy'
        idle_policy:
          description: Runtime idle suspension and automatic wakeup policy.
          allOf:
            - $ref: '#/components/schemas/IdlePolicy'
        id:
          description: Stable runtime UUID.
          type: string
        created_at:
          description: RFC3339 timestamp when the control-plane runtime row was created.
          type: string
        updated_at:
          description: RFC3339 timestamp of the last control-plane runtime row mutation.
          type: string
        ingress_specs:
          description: Active ingress specs.
          type: array
          items:
            $ref: '#/components/schemas/PublicIngressSpec'
        resources:
          description: Runtime resource state.
          allOf:
            - $ref: '#/components/schemas/RuntimeResources'
        image_id:
          description: Stable Runtime Image variant identifier.
          type: string
        status:
          description: Runtime status.
          allOf:
            - $ref: '#/components/schemas/PublicRuntimeStatus'
        degraded:
          description: Whether a running runtime has lacked a new successful heartbeat for at least 60 seconds.
          type: boolean
        desired_status:
          description: Control-plane target lifecycle state.
          type: string
          enum:
            - running
            - paused
            - suspended
            - shutdown
            - deleting
        ssh_enabled:
          description: Whether this runtime supports SSH access.
          type: boolean
        vnc_enabled:
          description: Whether the shared VNC desktop is configured to run with this runtime.
          type: boolean
        vnc_ready:
          description: Whether the current Worker assignment has published a ready VNC mapping.
          type: boolean
        vnc_error_code:
          description: Bounded machine-readable VNC startup failure code.
          type: string
          nullable: true
        vnc_connection:
          description: Fixed native VNC gateway connection parameters for this runtime's zone.
          allOf:
            - $ref: '#/components/schemas/VncGatewayConnection'
        error_code:
          description: Bounded machine-readable provisioning failure code.
          type: string
          nullable: true
        owner_user_id:
          description: Organization member who owns the runtime.
          type: string
        can_manage:
          description: Whether the current caller may perform control operations on this runtime.
          type: boolean
        revision:
          description: Monotonic runtime aggregate revision.
          type: integer
          format: uint64
          minimum: 1
        secret_configuration:
          description: Canonical inline secret injection configuration.
          type: array
          items:
            $ref: '#/components/schemas/RuntimeSecretConfiguration'
      required:
        - id
        - created_at
        - updated_at
        - degraded
        - display_name
        - resources
        - image_id
        - ingress_specs
        - egress_policy
        - idle_policy
        - llm_tool_io_capture_enabled
        - llm_session_content_capture_enabled
        - llm_token_saving_policy
        - status
        - desired_status
        - ssh_enabled
        - vnc_enabled
        - vnc_ready
        - vnc_connection
        - owner_user_id
        - can_manage
        - revision
        - secret_configuration
    SecretInjectionAction:
      description: Where an egress secret is injected.
      type: string
      enum:
        - header
        - query
    SecretEnvironmentInjection:
      description: Environment variable populated from a secret.
      type: object
      properties:
        name:
          type: string
        value_template:
          type: string
      required:
        - name
        - value_template
      additionalProperties: false
    SecretEgressInjection:
      description: HTTP egress credential populated from a secret.
      type: object
      properties:
        host_pattern:
          type: string
        path_pattern:
          type: string
          nullable: true
        action:
          $ref: '#/components/schemas/SecretInjectionAction'
        name:
          type: string
        value_template:
          type: string
      required:
        - host_pattern
        - action
        - name
        - value_template
      additionalProperties: false
    SecretFileInjection:
      description: Managed credential file populated from a secret.
      type: object
      properties:
        path:
          description: Delivery path, relative to the guest home directory.
          type: string
        value_template:
          type: string
      required:
        - path
        - value_template
      additionalProperties: false
    RuntimeSecretConfiguration:
      description: Inline injection configuration for one tenant secret.
      type: object
      properties:
        secret_id:
          type: string
        environment:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SecretEnvironmentInjection'
        egress_rules:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SecretEgressInjection'
        files:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SecretFileInjection'
      required:
        - secret_id
      additionalProperties: false
    Secret:
      description: Secret response object.
      type: object
      properties:
        cache_ttl_secs:
          description: Worker-side cache TTL in seconds.
          type: integer
          format: uint32
          minimum: 0
        display_name:
          description: User-chosen display name.
          type: string
        id:
          description: Stable secret UUID.
          type: string
        value_preview:
          description: Server-masked preview (first and last chars) of the value, for display only. Never the full value.
          type: string
      required:
        - id
        - display_name
        - cache_ttl_secs
    PatchRuntimeRequest:
      description: Runtime patch request.
      type: object
      properties:
        environment_variables:
          description: Complete replacement of the runtime's non-secret environment variables. An empty object removes every variable; omit to leave unchanged. The same name, value, and reservation rules as creation apply.
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
        display_name:
          description: New user-facing runtime name. The runtime UUID and data-plane identity remain unchanged.
          type: string
          minLength: 1
          maxLength: 63
        egress_policy:
          allOf:
            - $ref: '#/components/schemas/PublicEgressPolicy'
        ingress_specs:
          description: Complete replacement ingress configuration. Omit to leave unchanged.
          type: array
          items:
            $ref: '#/components/schemas/PublicIngressSpec'
        idle_policy:
          description: Idle policy. Omit to leave unchanged.
          allOf:
            - $ref: '#/components/schemas/IdlePolicy'
        llm_tool_io_capture_enabled:
          description: Whether official LLM HTTP API tool input/output capture is enabled. Omit to leave unchanged.
          type: boolean
        llm_session_content_capture_enabled:
          description: Explicitly opt in to user, assistant, and tool conversation content capture. Disabled by default; independent from tool-only capture. Omit to leave unchanged.
          type: boolean
        vnc_enabled:
          description: Enable or disable the on-demand shared VNC desktop. Omit to leave unchanged.
          type: boolean
        llm_token_saving_policy:
          description: Per-method LLM tool-output compression patch. Omit to leave unchanged.
          allOf:
            - $ref: '#/components/schemas/PatchLlmTokenSavingPolicy'
        resources:
          allOf:
            - $ref: '#/components/schemas/PatchRuntimeResources'
        secret_configuration:
          description: Complete replacement inline secret configuration. Omit to leave unchanged.
          type: array
          items:
            $ref: '#/components/schemas/RuntimeSecretConfiguration'
      additionalProperties: false
    PatchRuntimeResourceRequests:
      description: Resource requests for runtime patching.
      type: object
      properties:
        memory_mib:
          description: Requested baseline memory in MiB.
          type: integer
          format: uint64
          minimum: 1
        disk_gib:
          description: New overlay capacity in GiB. Only growth while fully shutdown is supported.
          type: integer
          format: uint32
          minimum: 32
          maximum: 256
      additionalProperties: false
    PatchRuntimeResources:
      description: Resource requests and limits for runtime patching.
      type: object
      properties:
        limits:
          description: Resource limits.
          allOf:
            - $ref: '#/components/schemas/RuntimeResourceLimits'
        requests:
          description: Resource requests.
          allOf:
            - $ref: '#/components/schemas/PatchRuntimeResourceRequests'
      additionalProperties: false
    RuntimeResourceLimits:
      description: Runtime resource limits.
      type: object
      properties:
        memory_mib:
          description: Maximum memory in MiB.
          type: integer
          format: uint64
          minimum: 1
      required:
        - memory_mib
      additionalProperties: false
    RuntimeResourceCurrent:
      description: Current runtime resource allocation.
      type: object
      properties:
        memory_mib:
          description: Current memory allocation in MiB.
          type: integer
          format: uint64
          minimum: 1
        observed_disk_gib:
          description: Worker-observed overlay virtual capacity in GiB.
          type: integer
          format: uint32
          minimum: 0
      required:
        - memory_mib
        - observed_disk_gib
      additionalProperties: false
    RuntimeResourceRequests:
      description: Runtime resource requests.
      type: object
      properties:
        memory_mib:
          description: Requested baseline memory in MiB.
          type: integer
          format: uint64
          minimum: 1
        vcpus:
          description: Requested virtual CPUs.
          type: integer
          format: uint32
          maximum: 2147483647
          minimum: 1
        disk_gib:
          description: Target overlay virtual capacity in GiB.
          type: integer
          format: uint32
          minimum: 16
          maximum: 256
      required:
        - vcpus
        - memory_mib
        - disk_gib
      additionalProperties: false
    RuntimeResources:
      description: Runtime resource requests and limits.
      type: object
      properties:
        current:
          description: Current resource allocation.
          allOf:
            - $ref: '#/components/schemas/RuntimeResourceCurrent'
        limits:
          description: Resource limits.
          allOf:
            - $ref: '#/components/schemas/RuntimeResourceLimits'
        requests:
          description: Resource requests.
          allOf:
            - $ref: '#/components/schemas/RuntimeResourceRequests'
      required:
        - current
        - requests
        - limits
      additionalProperties: false
tags:
