    Checkpoint:
      description: Checkpoint response object.
      type: object
      properties:
        kind:
          description: Canonical checkpoint kind, full or cold. Absent on older servers.
          type: string
        display_name:
          description: User-chosen display name.
          type: string
        id:
          description: Stable checkpoint UUID.
          type: string
        created_at:
          description: RFC3339 timestamp when the control-plane checkpoint row was created.
          type: string
        resources:
          description: Checkpoint resource state.
          allOf:
            - $ref: '#/components/schemas/RuntimeResources'
        state:
          description: Checkpoint lifecycle state.
          allOf:
            - $ref: '#/components/schemas/PublicCheckpointState'
        safe_error_code:
          description: Bounded non-sensitive reason when checkpoint creation failed.
          type: string
          nullable: true
        source_runtime:
          description: Runtime that produced this checkpoint, or its retained name after deletion.
          allOf:
            - $ref: '#/components/schemas/CheckpointSourceRuntime'
      required:
        - id
        - created_at
        - display_name
        - state
        - resources
    CheckpointSourceRuntime:
      description: Source runtime lineage for a checkpoint.
      type: object
      properties:
        id:
          description: Stable runtime UUID. Null after the source runtime is deleted.
          type: string
          nullable: true
        name:
          description: Runtime name captured when the checkpoint was created.
          type: string
      required:
        - id
        - name
    CreateCheckpointRequest:
      description: Checkpoint creation request.
      type: object
      properties:
        kind:
          description: Full VM snapshot (`full` or equivalent `live`), or disk-only snapshot (`cold`) of a fully shutdown runtime.
          type: string
          default: full
          enum:
            - full
            - live
            - cold
        name:
          description: Human-readable checkpoint name.
          type: string
          nullable: true
    DisabledIdlePolicy:
