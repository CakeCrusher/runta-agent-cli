        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security:
        - BearerAuth: []
  /v2/images/builds:
    get:
      tags:
        - Runtimes
      summary: List Dockerfile Runtime Image builds
      operationId: listRuntimeImageBuilds
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: uint32
            minimum: 1
            maximum: 100
            default: 50
      responses:
