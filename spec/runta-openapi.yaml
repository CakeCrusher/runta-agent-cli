        vnc_enabled:
          description: Start the shared VNC desktop whenever the runtime is running.
          type: boolean
          default: false
        repositories:
          description: GitHub repository override in checkout order. Omit or pass an empty array to inherit the checkpoint snapshot. The first repository becomes the default workspace.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RuntimeRepositorySelection'
        llm_tool_io_capture_enabled:
          description: Opt in to official LLM HTTP API tool input/output capture.
          type: boolean
          default: false
        llm_session_content_capture_enabled:
          description: Explicitly opt in to user, assistant, and tool conversation content capture. Disabled by default; independent from tool-only capture.
          type: boolean
