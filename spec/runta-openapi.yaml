  /v2/runtimes/{runtime_id}/exec/stream:
    get:
      tags:
      - Runtimes
      summary: Run a command inside a runtime (WebSocket)
      operationId: execRuntime
      description: "Opens a WebSocket session that runs **one** command inside a running runtime. It streams\nstdout\
        \ and stderr back and ends with the command's exit code. It is a standard RFC 6455 upgrade:\nconnect to `wss://api.runta.com/v2/runtimes/{runtime_id}/exec/stream`\
        \ with\n`Authorization: Bearer <API key>`. There is no ticket step and no subprotocol.\n\n**Use exec when**\
        \ you know the exact command and want its output now: inspecting files,\nrunning tests or builds, installing\
        \ packages, checking process state. It is synchronous,\ncheap (the first output arrives in about 1 s) and\
        \ deterministic. **Delegate to a Cloud Agent\n(`POST /v2/agents`) instead** when the work is open-ended, takes\
        \ many steps, or must keep running\nafter you disconnect. An exec session is tied to the WebSocket: **if the\
        \ connection drops for\nany reason, the command is killed**, and you cannot reattach.\n\nProtocol:\n  1. Send\
        \ a `start` message first. It must be the first frame.\n  2. Optionally send `stdin` chunks, then `close_stdin`.\
        \ Send `close_stdin` immediately if\n     the command reads no input; otherwise commands such as `cat` wait\
        \ forever.\n  3. Read `stdout`/`stderr` frames until an `exit` frame (success: the command ran, check `code`)\n\
        \     or an `error` frame (the server refused or aborted the session). One of these always comes\n     before\
        \ the socket closes normally. If the socket closes without one, treat the outcome as\n     unknown and do\
        \ not assume the command ran or did not run.\n  4. Ignore `heartbeat` frames. The server sends one every 30\
        \ s.\n\nThe command is executed directly (argv), not through a shell. For pipes, redirects, `cd` or\n`&&`,\
        \ use `command: \"bash\", args: [\"-lc\", \"<script>\"]`. It runs as root with cwd `/root`.\nSeveral sessions\
        \ can run at the same time on one runtime.\n"
      parameters:
      - in: path
        name: runtime_id
        required: true
        description: Runtime UUID. Display names are rejected (422 invalid_argument); look the UUID up with `listRuntimes`.
        schema:
          type: string
          format: uuid
      responses:
        '101':
          description: Switching Protocols. The WebSocket is open. Send a `start` message (see `x-websocket`).
        '401':
          description: 'Missing or invalid API key (`unauthenticated`: "missing Authorization bearer token" or "invalid
            bearer credential"). Check that the key is set and sent as `Authorization: Bearer`. Do not retry with
            the same key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: '`not_found`: no runtime with this UUID is visible to this key. It may have been deleted, or
            belong to another organization. List runtimes to find the right ID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`failed_precondition`: the runtime is not running (for example paused: "runtime must be started
            before access can be resolved"). Resume it (`POST /v2/runtimes/{runtime_id}/resume`) and then connect
            again. While the runtime is still resuming, the upgrade waits until the runtime is ready (about 10 s observed)
            instead of failing, so one reconnect usually succeeds.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`invalid_argument`: `runtime_id` is not a UUID ("runtime_id must be a UUID"). Look up the
            runtime''s `id` by name and retry with it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - BearerAuth: []
      x-websocket:
        encoding: Every message is a UTF-8 JSON object in a text frame, discriminated by `type`. Byte payloads are
          standard padded base64 in `data_base64`. A single server frame can be about 87 KB of JSON (64 KiB of decoded
          data), so do not use a small client max-message size.
        clientMessages:
          oneOf:
          - $ref: '#/components/schemas/ExecStart'
          - $ref: '#/components/schemas/ExecStdin'
          - $ref: '#/components/schemas/ExecCloseStdin'
          - $ref: '#/components/schemas/ExecSignal'
          - $ref: '#/components/schemas/ExecResize'
          - $ref: '#/components/schemas/ExecHeartbeat'
          discriminator:
            propertyName: type
        serverMessages:
          oneOf:
          - $ref: '#/components/schemas/ExecStdout'
          - $ref: '#/components/schemas/ExecStderr'
          - $ref: '#/components/schemas/ExecExit'
          - $ref: '#/components/schemas/ExecError'
          - $ref: '#/components/schemas/ExecHeartbeat'
          discriminator:
            propertyName: type
        closeBehavior:
        - when: after an `exit` frame
          close: Close frame without a status code (clients see 1005). With `tty=true` the TCP connection is closed
            with no Close frame (1006).
        - when: after an `error` frame, or after a malformed client frame (invalid JSON, `start` without `command`,
            non-string `signal`)
          close: TCP closed with no Close frame (1006). Malformed frames get no `error` message, so validate before
            sending.
        - when: client closes (any code) or the connection drops before `exit`
          close: The command and its child processes are killed within seconds. Nothing keeps running and no result
            is available.
        examples:
        - description: echo hi
          frames:
          - '> {"type":"start","command":"echo","args":["hi"],"env":{},"tty":false,"rows":null,"cols":null}'
          - '> {"type":"close_stdin"}'
          - < {"type":"stdout","data_base64":"aGkK"}
          - < {"type":"exit","code":0}
        session:
          start:
            message:
              type: start
              env: {}
              tty: false
              rows: null
              cols: null
            argv:
              command: command
              args: args
            options:
              env: env
          noStdin:
          - type: close_stdin
          stdin:
            type: stdin
            field: data_base64
            encoding: base64
            end:
              type: close_stdin
          output:
            stdout:
              type: stdout
              field: data_base64
              encoding: base64
            stderr:
              type: stderr
              field: data_base64
              encoding: base64
          exit:
            type: exit
            field: code
          error:
            type: error
            field: message
          ignore:
          - heartbeat
          terminate:
            type: signal
            signal: SIGTERM
