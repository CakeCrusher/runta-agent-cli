  /v2/runtimes/{runtime_id}/checkpoints:
    post:
      tags:
        - Checkpoints
      summary: Create a checkpoint from a runtime
      operationId: createCheckpoint
      description: |-
        Snapshots a runtime. `kind: full` (alias `live`) captures a running VM including memory; `cold` captures
        only the disk of a shut-down runtime. Returns immediately with `state: creating`; poll `getCheckpoint`
        until `ready` (or `failed`). Start copies with `createRuntime` and `checkpoint_id`: each restore is a
        new, independent runtime. A checkpoint stores everything on the VM, including any logins.
      x-wait:
        operationId: getCheckpoint
        parameters:
          checkpoint_id: $response.body#/data/id
        until:
        - pointer: /data/state
          in:
          - ready
        fail:
        - pointer: /data/state
          in:
          - failed
        timeoutSeconds: 900
      parameters:
        - in: path
          name: runtime_id
          description: Runtime UUID. Display names are rejected (422 invalid_argument); look the UUID up with `listRuntimes`.
          required: true
          schema:
            description: Runtime UUID. Display names are rejected (422 invalid_argument); look the UUID up with `listRuntimes`.
            type: string
          style: simple
      requestBody:
        description: Checkpoint creation request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckpointRequest'
        required: true
      responses:
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: Response envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointResponse'
