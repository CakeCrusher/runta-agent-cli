    PublicEgressPolicy:
      description: Per-runtime egress gateway policy.
      oneOf:
        - $ref: '#/components/schemas/DenylistEgressPolicy'
        - $ref: '#/components/schemas/AllowlistEgressPolicy'
      discriminator:
        propertyName: mode
        mapping:
          denylist: '#/components/schemas/DenylistEgressPolicy'
          allowlist: '#/components/schemas/AllowlistEgressPolicy'
    DenylistEgressPolicy:
      description: Deny matching hosts and allow all other egress destinations.
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - denylist
        denied_hosts:
          description: Host names, wildcard patterns, IP addresses, or CIDR ranges to deny.
          type: array
          maxItems: 128
          items:
            type: string
      required:
        - mode
        - denied_hosts
    AllowlistEgressPolicy:
      description: Allow only matching egress destinations.
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - allowlist
        allowed_hosts:
          description: Host names, wildcard patterns, IP addresses, or CIDR ranges to allow.
          type: array
          maxItems: 128
          items:
            type: string
      required:
        - mode
        - allowed_hosts
    PublicErrorCode:
      type: string
      enum:
        - already_exists
        - command_failed
        - deadline_exceeded
        - failed_precondition
        - internal
        - invalid_argument
        - not_found
        - permission_denied
        - rate_limited
        - unauthenticated
        - unavailable
        - unimplemented
      x-enum-descriptions:
        already_exists: A resource with this name or key exists. Reuse it, or pick another name.
        command_failed: A command run on your behalf failed; read the message.
        deadline_exceeded: The server timed out. Retry reads; before retrying a create, check whether it happened.
        failed_precondition: 'Wrong state for this action: a paused runtime needs resumeRuntime, a shut-down or suspended
          one needs startRuntime; a stale expected_revision needs a fresh getRuntime.'
        internal: Server error. Retry later; report request_id if it persists.
        invalid_argument: A parameter or field is invalid (for example a display name where a UUID is required). Fix the
          request; do not retry it unchanged.
        not_found: 'Nothing with this ID is visible to this API key: wrong ID, already deleted, or another organization.'
        permission_denied: This API key may not perform this action on this resource.
        rate_limited: Too many requests. Wait (honor Retry-After) and retry.
        unauthenticated: 'Missing or invalid API key. Send a valid key as Authorization: Bearer; retrying with the same
          key will not help.'
        unavailable: Temporarily unavailable (capacity or maintenance). Retry with backoff.
        unimplemented: Not supported for this resource or account.
    PublicIngressProtocol:
      description: HTTP/HTTPS application-layer ingress protocol.
      type: string
      enum:
        - http
        - https
    PublicIngressSpec:
      description: Public ingress forwarding rule.
      type: object
      properties:
        protocol:
          description: Application-layer protocol.
          allOf:
            - $ref: '#/components/schemas/PublicIngressProtocol'
        runtime_port:
          description: Port inside the runtime VM.
          type: integer
          format: uint16
          maximum: 65535
          minimum: 0
      required:
        - protocol
        - runtime_port
    PublicRuntimeStatus:
      description: Runtime state of a runtime.
      type: string
      enum:
        - running
        - paused
        - shutdown
        - creating
        - deleting
        - error
        - crashed
        - suspended
        - unavailable
      x-enum-descriptions:
        running: 'Usable: commands and agents work.'
        paused: Frozen by pauseRuntime. Not usable (execRuntime returns 409) until resumeRuntime.
        shutdown: Stopped by stopRuntime; the disk is kept. Boot it with startRuntime.
        creating: 'Being created or restored; poll getRuntime. If error_code is set while creating, it will not start:
          delete it and retry.'
        deleting: Deletion in progress; it will return 404.
        error: Failed; see error_code. Delete it and create a new one.
        crashed: The VM crashed; see error_code. Boot it with startRuntime, or delete and recreate it.
        suspended: Suspended by its idle policy. Boot it with startRuntime (a suspend_only policy needs an explicit start).
        unavailable: Its host is temporarily unreachable. Retry getRuntime later.
