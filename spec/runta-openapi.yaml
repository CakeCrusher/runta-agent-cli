components:
  parameters:
    RuntimeExpectedRevision:
      in: query
      name: expected_revision
      description: |-
        The runtime's current `revision` (from `getRuntime`). Mutations are rejected with 409 if the runtime
        changed since you read it: read it again and retry.
      x-default-from:
        operationId: getRuntime
        parameters:
          runtime_id: $request.path.runtime_id
        value: $response.body#/data/revision
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: Caller-generated key for retry-safe financial mutations.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RuntimeCreateIdempotencyKey:
      in: header
      name: Idempotency-Key
      description: Optional caller-generated key reused across retries of one logical runtime creation.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, malformed, or rejected bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The bearer token is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |-
        The request conflicts with the resource's current state (`failed_precondition`): for example the runtime
        is paused (resume it), shut down or suspended (start it), or `expected_revision` is stale (read the
        runtime again and retry).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Validation:
      description: Validation or application error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: Operation is not implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Upstream service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Timeout:
      description: Upstream request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Runta API Key
      description: A Runta API Key bound to exactly one organization.
  schemas:
    ExecStart:
      type: object
      description: Starts the command. It must be the first message, and only one is allowed per session. Unknown fields
        (for example `cwd`) are ignored. To change directory, use `bash -lc 'cd DIR && …'`.
      required:
      - type
      - command
      properties:
        type:
          type: string
          enum:
          - start
        command:
          type: string
          minLength: 1
          description: Executable to run, resolved on PATH. An empty string gets the error "command is required". A
            missing binary returns `exit` code 127.
          example: bash
        args:
          type: array
          items:
            type: string
          default: []
          example:
          - -lc
          - ls -la && git status
        env:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: Extra environment variables for the process.
        tty:
          type: boolean
          default: false
          description: Allocate a pseudo-terminal. With a TTY, stdout and stderr are merged into `stdout` frames with
            `\r\n` line endings, and SIGINT reaches the foreground process. Leave this false for machine-readable output.
        rows:
          type: integer
          nullable: true
          description: Terminal rows (only used when `tty` is true).
        cols:
          type: integer
          nullable: true
          description: Terminal columns (only used when `tty` is true).
    ExecStdin:
      type: object
      required:
      - type
      - data_base64
      description: Writes bytes to the command's stdin. Valid only after `start`.
      properties:
        type:
          type: string
          enum:
          - stdin
        data_base64:
          type: string
          format: byte
    ExecCloseStdin:
      type: object
      required:
      - type
      description: Closes the command's stdin (EOF). Send it right after `start` if the command reads no input.
      properties:
        type:
          type: string
          enum:
          - close_stdin
    ExecSignal:
      type: object
      required:
      - type
      - signal
      description: Sends a signal to the command. Only interrupt and terminate are supported. Without a TTY, SIGINT
        has no visible effect, so use SIGTERM to stop a command (its `exit.code` is then -1). Any other value gets `error`
        "unsupported signal '<value>'" and the session ends.
      properties:
        type:
          type: string
          enum:
          - signal
        signal:
          type: string
          enum:
          - SIGINT
          - INT
          - SIGTERM
          - TERM
    ExecResize:
      type: object
      required:
      - type
      - rows
      - cols
      description: Resizes the pseudo-terminal of a `tty` session.
      properties:
        type:
          type: string
          enum:
          - resize
        rows:
          type: integer
        cols:
          type: integer
    ExecHeartbeat:
      type: object
      required:
      - type
      description: Keepalive. The server sends one every 30 s; ignore it. A client may send one, and the server accepts
        it without replying.
      properties:
        type:
          type: string
          enum:
          - heartbeat
    ExecStdout:
      type: object
      required:
      - type
      - data_base64
      description: A chunk of stdout, up to 64 KiB of decoded data, sent as it is produced. Chunks do not follow line
        or UTF-8 boundaries, so concatenate the bytes before decoding.
      properties:
        type:
          type: string
          enum:
          - stdout
        data_base64:
          type: string
          format: byte
    ExecStderr:
      type: object
      required:
      - type
      - data_base64
      description: A chunk of stderr (only when `tty` is false). The same chunking rules apply as for stdout.
      properties:
        type:
          type: string
          enum:
          - stderr
        data_base64:
          type: string
          format: byte
    ExecExit:
      type: object
      required:
      - type
      - code
      description: 'Final message: the command finished. `code` is the process exit status (0 means success, 127 means
        command not found, 128+N means the shell reported death by signal N). It is -1 when the process was terminated
        by a `signal` message. The server closes the socket right after.'
      properties:
        type:
          type: string
          enum:
          - exit
        code:
          type: integer
          minimum: -1
          maximum: 255
    ExecError:
      type: object
      required:
      - type
      - message
      description: 'Final message: the session was rejected or aborted and no `exit` follows. Observed messages: "command
        is required" (fix the `start` message), "first websocket frame must be start" (send `start` first), "unsupported
        signal ''<x>''" (use SIGTERM or SIGINT). If a command was running, treat its outcome as unknown.'
      properties:
        type:
          type: string
          enum:
          - error
        message:
          type: string
    CreateCloudAgentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        system_prompt:
          type: string
          maxLength: 65536
        initial_message:
          type: string
          maxLength: 65536
        repositories:
          description: Ordered GitHub repositories to initialize for fresh or checkpoint runtimes. The first is the default workspace. Nonempty selections are not allowed for existing runtimes.
          type: array
          items:
            $ref: '#/components/schemas/RuntimeRepositorySelection'
        model_provider:
          $ref: '#/components/schemas/ManagedModelProviderReference'
        runtime:
          $ref: '#/components/schemas/CloudAgentRuntimeReference'
        harness:
          $ref: '#/components/schemas/CloudAgentHarnessRequest'
      required:
        - model_provider
      additionalProperties: false
    ManagedModelProviderReference:
      type: object
      properties:
        type:
          type: string
          enum:
            - managed
        id:
          type: string
          minLength: 1
      required:
        - type
        - id
      additionalProperties: false
    CloudAgentRuntimeReference:
      type: object
      properties:
        type:
          type: string
          enum:
            - fresh
            - checkpoint
            - existing
        image_id:
          type: string
        checkpoint_id:
          type: string
        id:
          type: string
      required:
        - type
      additionalProperties: false
    CloudAgentHarnessRequest:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
      additionalProperties: false
    CloudAgent:
      type: object
      properties:
        id:
          type: string
        runtime_id:
          type: string
        harness_id:
          type: string
        name:
          type: string
        status:
          description: |-
            Lifecycle of the agent's runtime. Observed: `pending` (starting, about 35-40 s), `running` (ready for
            runs), `shutdown`. Create runs only when `running`.
          type: string
        created_at_unix_seconds:
          type: integer
          format: int64
        updated_at_unix_seconds:
          type: integer
          format: int64
        latest_reply:
          $ref: '#/components/schemas/CloudAgentLatestReply'
      required:
        - id
        - runtime_id
        - harness_id
        - name
        - status
        - created_at_unix_seconds
        - updated_at_unix_seconds
      additionalProperties: false
    CloudAgentLatestReply:
      type: object
      properties:
        run_id:
          type: string
        text:
          type: string
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
      required:
        - run_id
        - text
        - created_at
        - updated_at
      additionalProperties: false
    CloudAgentComputerSession:
      type: object
      properties:
        agent_id:
          type: string
        runtime_id:
          type: string
        expires_at:
          type: string
          format: date-time
        channels:
          $ref: '#/components/schemas/CloudAgentComputerSessionChannels'
      required: [agent_id, runtime_id, expires_at, channels]
      additionalProperties: false
    CloudAgentComputerSessionChannels:
      type: object
      description: Extensible set of transports authorized by this Runta session. VNC is available now; computer-use transports can be added without changing the session envelope.
      properties:
        vnc:
          $ref: '#/components/schemas/CloudAgentVncSessionChannel'
      required: [vnc]
      additionalProperties: false
    CloudAgentVncSessionChannel:
      type: object
      properties:
        websocket_url:
          type: string
          format: uri
        protocols:
          type: array
          items:
            type: string
      required: [websocket_url, protocols]
      additionalProperties: false
    CloudAgentList:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/CloudAgent'
        next_cursor:
          type: string
          nullable: true
      required:
        - agents
        - next_cursor
      additionalProperties: false
    UpdateCloudAgentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - name
      additionalProperties: false
    CreateCloudAgentRunRequest:
      type: object
      properties:
        prompt:
          type: string
          maxLength: 65536
        images:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/CloudAgentPromptImage'
        resume_session_id:
          type: string
        parent_run_id:
          type: string
      required:
        - prompt
      additionalProperties: false
    CloudAgentPromptImage:
      type: object
      properties:
        type:
          type: string
          enum: [image]
        data:
          type: string
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
      required: [type, data, mime_type]
      additionalProperties: false
    CloudAgentRun:
      type: object
      properties:
        id:
          type: string
        agent_id:
          type: string
        status:
          enum: [queued, running, cancelling, finished, failed, cancelled]
          x-enum-descriptions:
            queued: Accepted, waiting to start. Keep polling.
            running: The agent is working. Keep polling.
            cancelling: Cancel requested; it will end as cancelled.
            finished: Done. `result` holds the agent's final message.
            failed: 'Ended with an error; `error` says why (for example the model provider rejected its key: fix the provider,
              then create a new run).'
            cancelled: Cancelled with cancelCloudAgentRun.
          type: string
        prompt:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        parent_run_id:
          type: string
          nullable: true
        dsh_session_id:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
      required:
        - id
        - agent_id
        - status
        - prompt
        - result
        - error
        - parent_run_id
        - dsh_session_id
        - created_at
        - updated_at
      additionalProperties: false
    CloudAgentSessionEvents:
      type: object
      properties:
        agent_id:
          type: string
        session_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/CloudAgentEvent'
      required:
        - agent_id
        - session_id
        - events
      additionalProperties: false
    CloudAgentEvent:
      description: Dynamic ACP event payload.
      type: object
      additionalProperties: true
    CreateCloudAgentArtifactRequest:
      type: object
      properties:
        run_id:
          type: string
        name:
          type: string
        media_type:
          type: string
        content_base64:
          type: string
      required:
        - run_id
        - name
        - content_base64
      additionalProperties: false
    CloudAgentArtifact:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        harness_id:
          type: string
        name:
          type: string
        media_type:
          type: string
        size:
          type: integer
          format: uint64
        created_at:
          type: string
        content_base64:
          type: string
      required:
        - id
        - run_id
        - harness_id
        - name
        - media_type
        - size
        - created_at
      additionalProperties: false
    RuntimeWorkspaceOperationKind:
      type: string
      enum:
        - list_directory
        - read_text
        - search_files
        - read_media
        - list_ports
    RuntimeWorkspaceOperationRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/RuntimeWorkspaceOperationKind'
        path:
          type: string
        query:
          type: string
        offset:
          type: integer
          format: uint64
          minimum: 0
      required:
        - kind
      additionalProperties: false
    RuntimeWorkspaceFileKind:
      type: string
      enum:
        - directory
        - text
        - image
        - video
        - file
    RuntimeWorkspaceFileEntry:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        kind:
          $ref: '#/components/schemas/RuntimeWorkspaceFileKind'
        size:
          type: integer
          format: uint64
          minimum: 0
      required:
        - name
        - path
        - kind
        - size
      additionalProperties: false
    RuntimeWorkspaceSearchMatch:
      type: object
      properties:
        path:
          type: string
        line:
          type: integer
          format: uint32
          minimum: 1
        preview:
          type: string
      required:
        - path
        - line
        - preview
      additionalProperties: false
    RuntimeWorkspacePort:
      type: object
      properties:
        port:
          type: integer
          format: uint16
          minimum: 1
          maximum: 65535
        forwardable:
          type: boolean
          description: Whether the listener accepts traffic addressed to the Runtime rather than loopback only. Omitted by older Runtime agents.
      required:
        - port
      additionalProperties: false
    RuntimeWorkspaceOperationResult:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/RuntimeWorkspaceOperationKind'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeWorkspaceFileEntry'
        text:
          type: string
        matches:
