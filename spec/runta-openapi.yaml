    CreateRuntimeRequest:
      description: Fresh runtime creation or checkpoint restoration request.
      oneOf:
        - $ref: '#/components/schemas/FreshRuntimeCreateRequest'
        - $ref: '#/components/schemas/CheckpointRuntimeRestoreRequest'
    FreshRuntimeCreateRequest:
      description: Create a fresh runtime from a Runtime Image.
      type: object
      properties:
        environment_variables:
          description: 'Non-secret environment variables the runtime carries. Names must match [A-Za-z_][A-Za-z0-9_]* and be at most 128 UTF-8 bytes. Names Runta sets itself are reserved: the RUNTA_ prefix, the runtime CA variables, the managed repository credentials, and the canonical names of the provider secret presets. Values must be at most 8192 UTF-8 bytes each and 65536 in total, and must not contain NUL, CR, or LF.'
          type: object
          default: {}
          maxProperties: 64
          additionalProperties:
            type: string
        egress_policy:
          description: Initial egress policy.
          allOf:
            - $ref: '#/components/schemas/PublicEgressPolicy'
          default:
            mode: denylist
            denied_hosts: []
        idle_policy:
          description: Initial idle policy. Omit to use disabled.
          allOf:
            - $ref: '#/components/schemas/IdlePolicy'
          default:
            mode: disabled
        ingress_specs:
          description: Optional ingress specs.
          type: array
          default: []
          maxItems: 16
          items:
            $ref: '#/components/schemas/PublicIngressSpec'
        name:
          description: Human-readable runtime name.
          type: string
          nullable: true
        resources:
          description: Runtime resource requests and limits.
          allOf:
            - $ref: '#/components/schemas/CreateRuntimeResources'
          default:
            requests:
              vcpus: 1
              memory_mib: 1024
            limits:
              memory_mib: 1024
        image:
          description: Runtime Image selection. Omit on a fresh create to use the default variant.
          allOf:
            - $ref: '#/components/schemas/CreateRuntimeImageSelection'
        secret_configuration:
          description: Complete inline secret injection configuration.
          type: array
          default: []
          items:
            $ref: '#/components/schemas/RuntimeSecretConfiguration'
        ssh_key_ids:
          description: Personal SSH key UUIDs to attach atomically.
          type: array
          default: []
          items:
            type: string
        vnc_enabled:
          description: Start the shared VNC desktop whenever the runtime is running.
          type: boolean
          default: false
        repositories:
          description: GitHub repositories to check out during runtime setup, in checkout order. The first repository becomes the default workspace. Repositories may span GitHub App installations.
          type: array
          default: []
          maxItems: 20
          items:
            $ref: '#/components/schemas/RuntimeRepositorySelection'
        llm_tool_io_capture_enabled:
          description: Opt in to official LLM HTTP API tool input/output capture.
          type: boolean
          default: false
        llm_session_content_capture_enabled:
          description: Explicitly opt in to user, assistant, and tool conversation content capture. Disabled by default; independent from tool-only capture.
          type: boolean
          default: false
        llm_token_saving_policy:
          description: Initial LLM tool-output compression policy. Omit to disable every method.
          allOf:
            - $ref: '#/components/schemas/CreateLlmTokenSavingPolicy'
          default:
            json_array_enabled: false
            log_enabled: false
            search_results_enabled: false
            git_diff_enabled: false
      additionalProperties: false
    CheckpointRuntimeRestoreRequest:
