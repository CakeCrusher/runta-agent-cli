          items:
            $ref: '#/components/schemas/RuntimeWorkspaceSearchMatch'
        media_base64:
          type: string
        media_type:
          type: string
        next_offset:
          type: integer
          format: uint64
          minimum: 0
        ports:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeWorkspacePort'
        truncated:
