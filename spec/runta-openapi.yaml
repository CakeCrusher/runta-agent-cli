        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      security:
        - BearerAuth: []
  /v2/runtimes:
    get:
      tags:
        - Runtimes
      summary: List runtimes
      operationId: listRuntimes
      parameters:
        - in: query
          name: status
          description: Comma-separated public status aliases.
          schema:
            description: Comma-separated public status aliases.
            type: string
          style: form
        - in: query
          name: limit
          description: Maximum number of runtimes to return.
          schema:
            description: Maximum number of runtimes to return.
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 50
          style: form
        - in: query
          name: after
          description: Opaque cursor returned by the previous page.
          schema:
            description: Opaque cursor returned by the previous page.
            type: string
          style: form
      responses:
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: List response envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRuntimesResponse'
        '401':
          description: Missing, malformed, or rejected bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The bearer token is not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The requested resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with current resource state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation or application error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '501':
          description: Operation is not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Upstream service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: Upstream request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - BearerAuth: []
    post:
      tags:
        - Runtimes
      summary: Create a runtime
      operationId: createRuntime
      description: |-
        Creates a runtime: an isolated cloud VM, either fresh from a Runtime Image (`image`, see
        `listRuntimeImages`; omit it for the default image) or restored from a checkpoint (`checkpoint_id`, see
        `CheckpointRuntimeRestoreRequest`; every restore is a new, independent copy).

        Returns 201 immediately with `status: creating`. The runtime is usable once `status` is `running`
        (about 15 s observed for the default resources). If `error_code` becomes set while it is still
        `creating`, it will not start (for example `placement_unavailable` when the requested resources cannot
        be placed): delete it and retry with smaller `resources`.

        It accrues cost until deleted (or paused/shut down/suspended). To hand a task to an agent, prefer
        `createCloudAgent`, which creates and manages its own runtime. Public ports (`ingress_specs`) are for
        previews and agent tooling, not production hosting.
      x-wait:
        operationId: getRuntime
        parameters:
          runtime_id: $response.body#/data/id
        until:
        - pointer: /data/status
          in:
          - running
        fail:
        - pointer: /data/status
          in:
          - error
          - crashed
        - pointer: /data/error_code
          present: true
        timeoutSeconds: 300
      parameters:
        - $ref: '#/components/parameters/RuntimeCreateIdempotencyKey'
      requestBody:
        description: Runtime creation request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuntimeRequest'
        required: true
      responses:
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '201':
          description: Runtime resource created.
          headers:
            Location:
              description: Canonical Runtime resource URI.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResponse'
        '401':
          description: Missing, malformed, or rejected bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The bearer token is not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The requested resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with current resource state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation or application error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '501':
          description: Operation is not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Upstream service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: Upstream request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - BearerAuth: []
  /v2/runtimes/{runtime_id}:
    get:
      tags:
        - Runtimes
      summary: Get a runtime by UUID
      operationId: getRuntime
      description: |-
        Returns the runtime. `status` says whether it is usable and what to do next (see `PublicRuntimeStatus`);
        `error_code` explains failures; `revision` is the value mutations require as `expected_revision`.
      parameters:
        - in: path
          name: runtime_id
          description: Runtime UUID. Display names are rejected (422 invalid_argument); look the UUID up with `listRuntimes`.
          required: true
          schema:
            description: Runtime UUID. Display names are rejected (422 invalid_argument); look the UUID up with `listRuntimes`.
            type: string
          style: simple
      responses:
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: Response envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResponse'
        '401':
          description: Missing, malformed, or rejected bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The bearer token is not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The requested resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with current resource state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation or application error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '501':
          description: Operation is not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Upstream service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: Upstream request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - BearerAuth: []
    delete:
      tags:
        - Runtimes
      summary: Delete a runtime by UUID
      operationId: deleteRuntime
      description: |-
        Permanently deletes the runtime and its disk. Anything not exported or checkpointed is lost; create a
        checkpoint first if you may need it again. Returns 202 while deletion proceeds; afterwards `getRuntime`
        returns 404.
      x-destructive: true
      x-wait:
        operationId: getRuntime
        parameters:
          runtime_id: $request.path.runtime_id
        until:
        - status: 404
        timeoutSeconds: 120
      parameters:
        - in: path
          name: runtime_id
          description: Runtime UUID. Display names are rejected (422 invalid_argument); look the UUID up with `listRuntimes`.
          required: true
          schema:
            description: Runtime UUID. Display names are rejected (422 invalid_argument); look the UUID up with `listRuntimes`.
            type: string
          style: simple
        - $ref: '#/components/parameters/RuntimeExpectedRevision'
      responses:
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '202':
          description: Runtime deletion accepted.
          headers:
            Location:
              description: Canonical Runtime resource URI.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResponse'
        '204':
