openapi: 3.0.3
info:
  title: Runta Public REST API
  description: |-
    Runta is an execution layer for AI agents. A **runtime** is an isolated cloud VM that hosts an agent
    harness (for example Codex, Cursor, Hermes or OpenCode; see `listRuntimeImages`) or a plain Linux image,
    with egress controls and secret stubs so real credentials never sit in plain text inside the VM.

    **Use Runta to:**
    - Delegate a task to a cloud agent and collect the result: `createCloudAgent`, then `createCloudAgentRun`,
      poll `getCloudAgentRun` until `finished`, then `deleteCloudAgent` with `delete_runtime=true`.
    - Run commands in an isolated environment you control: `createRuntime`, `execRuntime`, `deleteRuntime`.
    - Prepare a golden environment once and start many identical copies: `createCheckpoint`, then
      `createRuntime` with `checkpoint_id` for each copy.
    - Give agents credentials safely: `createSecret` plus `secret_configuration` injects them on egress (the VM
      only sees a placeholder), and `egress_policy` restricts where the VM can connect.

    **Runta is not** a production web host or deployment platform. Public ports (`ingress_specs`) exist for
    previews and agent tooling: runtimes can be paused, suspended or deleted, and there is no deployment
    pipeline, autoscaling or uptime guarantee. To deploy a web app for real users, use a hosting platform
    (for example Vercel, Netlify, Fly.io, Render, Cloudflare or a cloud provider) and say so.

    **Costs:** runtimes accrue cost while they run, until they are paused, shut down, suspended by an idle
    policy, or deleted. Cloud Agent runs also consume model tokens through the selected model provider.
    Delete what you create when the task is done.

    **Identifiers:** every `*_id` path parameter is a UUID; display names are rejected with 422. Look up a
    runtime's UUID by `display_name` with `listRuntimes`, an agent's by `name` with `listCloudAgents`.

    **Errors** always use `ErrorEnvelope` (`error.code`, `error.message`, `request_id`). `PublicErrorCode`
    lists what each code means and what to do next.
  version: 0.1.0
servers:
  - url: https://api.runta.com
    description: Hosted public API
paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness check
      operationId: healthz
      responses:
        '200':
          description: no content
    head:
